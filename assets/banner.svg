<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-label="Terminal: datashield --about — Practical privacy, security and AI-safety tools for everyday developers. datashield status lists six live projects.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .p { fill: #3fb950; }
    .cmd { fill: #e6edf3; }
    .flag { fill: #79c0ff; }
    .out { fill: #8b949e; }
    .ok { fill: #3fb950; }
    .warn { fill: #d29922; }
    .title { fill: #f0f6fc; font-weight: 700; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .l1 { animation: show 0.01s 0.2s both; }
    .l2 { animation: show 0.01s 0.8s both; }
    .l3 { animation: show 0.01s 1.3s both; }
    .l4 { animation: show 0.01s 1.9s both; }
    .l5 { animation: show 0.01s 2.4s both; }
    .l6 { animation: show 0.01s 2.9s both; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .l1, .l2, .l3, .l4, .l5, .l6, .cursor { animation: none; }
    }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="1279" height="499" rx="14" fill="#0d1117" stroke="#30363d"/>
  <path d="M14.5 0.5h1251a14 14 0 0 1 14 14V44H0.5V14.5a14 14 0 0 1 14-14Z" fill="#161b22"/>
  <line x1="0.5" y1="44" x2="1279.5" y2="44" stroke="#30363d"/>
  <circle cx="28" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="7" fill="#febc2e"/>
  <circle cx="76" cy="22" r="7" fill="#28c840"/>
  <text x="640" y="27" text-anchor="middle" class="mono out" font-size="14">labs@datashield: ~/lightweight-labs — zsh</text>

  <g class="mono" font-size="21">
    <g class="l1">
      <text x="40" y="96"><tspan class="p">➜</tspan><tspan class="flag"> ~ </tspan><tspan class="cmd">datashield </tspan><tspan class="flag">--about</tspan></text>
    </g>
    <g class="l2">
      <text x="40" y="146" class="title" font-size="44" letter-spacing="-0.5">DataShield Lightweight Labs</text>
    </g>
    <g class="l3">
      <text x="40" y="186" class="cmd" font-size="20">Practical privacy, security &amp; AI-safety tools for everyday developers.</text>
    </g>
    <g class="l4">
      <text x="40" y="242"><tspan class="p">➜</tspan><tspan class="flag"> ~ </tspan><tspan class="cmd">datashield </tspan><tspan class="flag">status</tspan></text>
    </g>
    <g class="l5" font-size="19">
      <text x="64" y="280"><tspan class="ok">[ live ]</tspan><tspan x="200" class="cmd">ai-privacy-guardrail</tspan><tspan x="590" class="out">AI / LLM · redact PII before you prompt</tspan></text>
      <text x="64" y="310"><tspan class="ok">[ live ]</tspan><tspan x="200" class="cmd">medredact</tspan><tspan x="590" class="out">healthcare · HIPAA Safe Harbor de-identification</tspan></text>
      <text x="64" y="340"><tspan class="ok">[ live ]</tspan><tspan x="200" class="cmd">cloud-sec-auditor</tspan><tspan x="590" class="out">cloud · AWS / GCP / Azure misconfig scanner</tspan></text>
      <text x="64" y="370"><tspan class="ok">[ live ]</tspan><tspan x="200" class="cmd">metascrub</tspan><tspan x="590" class="out">media · strip GPS &amp; authors from photos, docs</tspan></text>
      <text x="64" y="400"><tspan class="ok">[ live ]</tspan><tspan x="200" class="cmd">privacy-data-protection-skills</tspan><tspan x="590" class="out">compliance · 282 privacy skills for AI agents</tspan></text>
      <text x="64" y="430"><tspan class="ok">[ live ]</tspan><tspan x="200" class="cmd">privacy-guide</tspan><tspan x="590" class="out">education · staying private online</tspan></text>
    </g>
    <g class="l6">
      <text x="40" y="474"><tspan class="p">➜</tspan><tspan class="flag"> ~ </tspan></text>
      <rect class="cursor" x="88" y="457" width="11" height="22" fill="#e6edf3"/>
    </g>
  </g>
</svg>
